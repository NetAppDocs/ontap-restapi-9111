root_overview:
  ai-gen:
    keywords: ontap automation, json encoding, http methods, hal linking, svm tunneling
    lead: The ONTAP REST API offers a comprehensive set of endpoints for interacting
      with ONTAP systems, using standard HTTP methods and JSON encoding. Explore these
      endpoints to efficiently manage clusters, storage, and network resources within
      your ONTAP environment.
categories:
- id: cloud
  title: ONTAP REST API cloud endpoints
  permalink: cloud_endpoints.html
  ai-gen:
    keywords: cloud targets,object storage,manage cloud,cloud management,storage targets
    lead: Manage cloud object storage targets to integrate cloud resources with your
      ONTAP environment. Use these endpoints to configure and monitor cloud connections
      effectively.
- id: cluster
  title: ONTAP REST API cluster endpoints
  permalink: cluster_endpoints.html
  ai-gen:
    keywords: cluster creation,add nodes,cluster configuration,update software,node
      discovery
    lead: Manage cluster creation, configuration, and node discovery to establish
      and optimize your ONTAP cluster. Use these endpoints for setting up nodes, updating
      software, and monitoring jobs effectively. Certain APIs are available to assist
      with cluster creation and tracking its progress before full establishment.
- id: networking
  title: ONTAP REST API networking endpoints
  permalink: networking_endpoints.html
  ai-gen:
    keywords: ipspaces, network domain, broadcast domains, ethernet ports, fibre channel,
      ip interfaces
    lead: Explore networking endpoints that provide insights into networking configurations
      such as IPspaces, interfaces, routes, ports, service policies, and broadcast
      domains. Use these endpoints to efficiently report and manage your network settings
      within ONTAP.
- id: svm
  title: ONTAP REST API svm endpoints
  permalink: svm_endpoints.html
  ai-gen:
    keywords: storage virtual machine, data access, cluster management, protocol configuration,
      network services
    lead: Manage Storage Virtual Machines (SVMs) and their attributes using SVM APIs,
      including configuration of CIFS and NFS protocols, export policies, and network
      services. SVMs facilitate secure and isolated data access within a cluster,
      appearing as dedicated servers to clients.
- id: name-services
  title: ONTAP REST API name-services endpoints
  permalink: name-services_endpoints.html
  ai-gen:
    keywords: name services,ldap configuration,dns resolution,nis servers,user credentials,mixed
      environment
    lead: Use name-services endpoints to retrieve and configure information about
      users and clients for authentication and credential mapping within ONTAP. This
      includes setting up NIS, LDAP, and DNS services as well as configuring SVMs
      with ns-switch for efficient network information searching.
- id: san
  title: ONTAP REST API SAN endpoints
  permalink: san_endpoints.html
  ai-gen:
    keywords: fibre channel,iscsi service,initiator group,lun maps,vmware vvol
    lead: Configure, provision, and manage SAN-related objects using these endpoints.
      Common tasks include setting up storage area networks and handling Fibre Channel
      and iSCSI connections.
- id: nvme
  title: ONTAP REST API NVMe endpoints
  permalink: nvme_endpoints.html
  ai-gen:
    keywords: nvme configuration,fibre channel logins,nvme interfaces,nvme services,nvme
      subsystems,nvme namespaces
    lead: Configure, provision, and manage NVMe-related objects using the NVMe REST
      API endpoints. Utilize these endpoints to support NVMe commands over fabric
      interconnects and manage connections from multiple hosts.
- id: application
  title: ONTAP REST API application endpoints
  permalink: application_endpoints.html
  ai-gen:
    keywords: application templates, storage management, protocol access, netapp best
      practices, smart containers
    lead: ONTAP application endpoints streamline storage management using application-specific
      terminology. These endpoints facilitate provisioning and managing storage objects
      while ensuring protocol access in line with NetApp best practices. By using
      application APIs, you can view and manage ONTAP objects as a cohesive group,
      with templates available for various database and virtualization applications.
- id: support
  title: ONTAP REST API support endpoints
  permalink: support_endpoints.html
  ai-gen:
    keywords: configuration backups,autosupport settings,event handling,node settings,cluster
      settings
    lead: Use ONTAP support endpoints to manage configuration backups, autosupport
      settings, and event handling. These APIs help ensure your cluster settings are
      protected and facilitate troubleshooting through event analysis.
- id: security
  title: ONTAP REST API security endpoints
  permalink: security_endpoints.html
  ai-gen:
    keywords: ontap security,cluster security,svm security,saml configuration,multi-factor
      authentication,saml identity provider
    lead: Use security endpoints to manage security settings for clusters and SVMs.
      These endpoints facilitate tasks such as configuring SAML authentication protocols
      to enhance security through third-party Identity Providers.
- id: storage
  title: ONTAP REST API storage endpoints
  permalink: storage_endpoints.html
  ai-gen:
    keywords: ontap storage,physical storage,logical storage,aggregates management,volume
      management,LUN management
    lead: Manage physical and logical storage using ONTAP storage APIs. These endpoints
      cover aggregates, volumes, LUNs, qtrees, snapshots, quotas, and storage efficiency.
- id: snapmirror
  title: ONTAP REST API snapmirror endpoints
  permalink: snapmirror_endpoints.html
  ai-gen:
    keywords: snapmirror technology,snapmirror copy,disaster recovery,vault backups,snapmirror
      policies
    lead: Utilize SnapMirror endpoints to create and manage asynchronous and synchronous
      data replication relationships, facilitating efficient data backup and recovery.
      These endpoints support configuration of SnapMirror policies, relationships,
      and data transfers, ensuring your data remains protected and accessible.
- id: ndmp
  title: ONTAP REST API ndmp endpoints
  permalink: ndmp_endpoints.html
  ai-gen:
    keywords: ndmp backup,network data management,tape storage,speed efficiency,svm
      aware,volume mobility
    lead: Utilize NDMP endpoints to streamline NAS data protection and enhance backup
      efficiency by directly transferring data to tape storage. These endpoints support
      managing NDMP configurations, nodes, SVMs, and sessions, optimizing performance
      with ONTAP's non-disruptive operations and volume mobility.
- id: snaplock
  title: ONTAP REST API snaplock endpoints
  permalink: snaplock_endpoints.html
  ai-gen:
    keywords: snaplock data,snaplock storage,snaplock compliance,snaplock retention,snaplock
      legal-hold
    lead: Utilize SnapLock endpoints to manage and enforce WORM and retention functionality
      for secure data storage. These endpoints support operations such as logging,
      compliance clock management, event-based retention policies, file retention
      settings, privileged deletes, file fingerprinting, and legal holds. SnapLock
